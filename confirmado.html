<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OKILIN — Email confirmado</title>
<style>
  html,body{height:100%;margin:0}
  body{
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:#f3f4f6; color:#111827;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:#fff; border:1px solid #e5e7eb; border-radius:20px;
    max-width:420px; width:100%; padding:32px 28px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
  }
  .logo{ font-size:30px; letter-spacing:6px; font-weight:800; color:#065f46; margin-bottom:20px; }
  .check{
    width:72px; height:72px; border-radius:50%; background:#d1fae5;
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px;
    font-size:38px; color:#0f6e56;
  }
  h1{ font-size:20px; margin:0 0 10px; }
  p{ font-size:15px; color:#4b5563; line-height:1.5; margin:0 0 6px; }
  .hint{ margin-top:18px; font-size:14px; color:#6b7280; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">OKILIN</div>
    <div class="check">✓</div>
    <h1>Email confirmado!</h1>
    <p>A tua conta está pronta.</p>
    <p class="hint">Abre a aplicação <b>OKILIN</b> no teu telemóvel e inicia sessão com o teu email e palavra-passe.</p>
  </div>
</body>
</html>
